#SAM
#Guns
8in/55_mk16=8"/55 RF Mark 16|8"/55 RF Mark 16|These were the first USN 8" (20.3 cm) guns to use separate rather than bag ammunition. With automatic shell handling and loading, a fire rate three times greater than that of previous 8" (20.3 cm) guns and coupled together with the use of "super-heavy" AP projectiles, these weapons made the Des Moines (CA-134) class the most powerful heavy cruisers ever built. One of the few large-caliber automatic gun designs that proved reliable in actual service use, these weapons were still giving good performance during the Vietnam War, some twenty-five years after they first entered service. Unfortunately, all this performance came at a steep price in weight, with the turrets mountings for these guns weighing 50% more than those in the previous Baltimore class.

