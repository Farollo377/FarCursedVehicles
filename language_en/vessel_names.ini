[usn_dd_forrest_sherman_ddg_late]
Type=DDG,Destroyer
Default=Forrest Sherman-class (DDG Major Caliber Lightweight Gun Refit),Sherman-MCLGR (DDG)
DefaultDescription=The 18-strong Forrest Sherman-class Destroyers were the first post-war class of US Destroyers. They were also the "Last Gunfighters" of the US Navy, being the last class of Destroyers armed with solely guns as built, as subsequent classes would be armed with missiles. They served from the 1950s to the late 1980s. This variant is further refitted with a Mk13 GMLS on the aft end and the experimental Mk71 8" gun system forward. This configuration was never adopted by the US Navy and only fitted to USS Hull. Ultimately, this turret was taken off of the Hull and the program was canceled. Later in their careers, they were issued with RIM-66A Standard (SM-1MR).
Variant1=DD-945 Hull,Hull


