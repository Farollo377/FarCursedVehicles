[General]
#Laser-guided 16in shell for the Iowa
Type=Projectile                // can be Projectile, Missile, Torpedo
TargetType=ASuW                // can be AAW, ASuW, ASW
CanNotAttackTypes=Aircraft,Helicopter,Missile,Bomb

Mass=862                               // in kg. Used for aircraft
AmmoPoints=862                         // For Supply System. Defines "price" of ammunition based on mass, volume, complexity and availability

DecalClass=GunImpacts          // referenced in effects/decals.ini
GroundDecalClass=GroundImpacts // referenced in effects/decals.ini

[Physics]
MuzzleVelocity=920             // meter per second
MaxRange=52700                 // in meters
CircularErrorProbable=40      // radius in meters at max range for shells to impact

[Guidance]
GuidanceType=5             // LaserHoming - requires a designator painting the target
MaxGuidedCorrection=800    // max lateral steer in meters around the ballistic aim point

[---------- Warhead Data ----------]
[WarheadData]
Power=35
ImpactSize=Large               // Impact size, can be small, medium, large, verylarge
Penetration=Always             // can be minor, moderate, heavy, always

[---------- Mesh definitions----------]
[Models]
ResourcesFolder=weapons/shells/
ResourcesRoot=shells_tracer_new
ResourcesMesh=shell_large
ResourcesMaterial=shell_mat_red

[---------- Effects ----------]
[Particles]
HitShipExplosionClass=LargeShipHitExplosion
HitAirExplosionClass=LargeMissileExplosions
HitWaterSplashClass=LargeWaterSplashes
HitDefaultExplosionClass=LargeGroundHitExplosions	//MediumGroundHitExplosions	//LargeMissileExplosions
HitGroundExplosionClass=LargeGroundHitExplosions
