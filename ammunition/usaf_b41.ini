[General]
#NukeBomb
Type=Bomb                              // can be Projectile, Missile, RBU, ASROC, Torpedo
TargetType=ASuW                        // can be AAW, ASuW, ASW

Mass=27000                               // in kg. Used for aircraft
AmmoPoints=666666                         // For Supply System. Defines "price" of ammunition based on mass, volume, complexity and availability

DefaultCameraDistance=0.6
MinCameraDistanceForeAft=0.29
MinCameraDistanceBroadside=0.29
CameraPivotHeight=0.0

DecalClass=Standard  // referenced in effects/decals.ini

[SensorData]
#Visual
VisualIdentificationRange=1       // Biggest range in nm at which this unit can be visually identified
IRSignature=VeryLarge
# Radar related (RCS => radar cross section)
RCS=VeryLarge
# Sonar related

[---------- Warhead Data ----------]
#Warhead Types:
#0 = Blast Fragmentation
#1 = Armor Piercing
#2 = HEAT
#3 = Illumination
#4 = Cluster
#5 = Runway Cratering

# Fuze Types:
# 0 = Impact Fuze
# 1 = Proximity Fuze

[WarheadData]
WarheadType=0
Power=66666
ImpactSize=80000                // Impact size, can be small, medium, large, verylarge
Penetration=always              // can be minor, moderate, heavy, always
FuzeProximityDistance=1000

[Guidance]
GuidanceType=1
MidCourseCorrection=0                  // 0 = None, 1 = Radio Command, 2 = Wire Guided
InitialFlightPhaseDuration=3         // time in seconds where the missile moves straight on without guiding
DropDuration=4.0 

#======================================== Flight Profile ===========================================================

#========================================= Launch stats ============================================================
MinLaunchRange=0.01                    // Minimum launch range in nautical miles
MaxLaunchRange=10.0                    // Maximum launch range in nautical miles
MinLaunchAltitude=8000                  // Minimum launch altitude in feet.
MaxLaunchAltitude=60000                // Maximum launch altitude in feet.
LaunchReliability=97                   // The lower the value, the greater risk of misfire or accident (0...100)
#========================================     Seeker     ===========================================================
CircularErrorRadius=30                 // Circular error radius in meters
#Homing
#ECCM
#SelfDestruct
SelfDestructDelay=0.0                  // delay in seconds for self destruction

[---------- Mesh definitions----------]
[Models]
ResourcesFolder=assets/models/B41/
ResourcesRoot=B41.obj
ResourcesMesh=B41
ResourcesMaterial=B41_mat.ini
############################################################
NumberOfSubModels=0

[---------- Effects ----------]
[Particles]
# Effects are referenced in /effects/effects.ini when using an effects class
# e.g. either:
# BoosterEffect=effects/weapons/emitters/submarine_torpedo_launch
# or
# BoosterEffectClass=BoosterEffects  // this will be referenced in effects.ini

# possible values (optionally with suffix "Class")
# BoosterEffect, InFligheEffect, UnderwaterTrail, ParachuteEffect, TorpedoSurfaceSplash, HitWaterSplash
# DebrisTrail, DebrisSplash, SmallFireEffect, ModerateFireEffect, SevereFireEffect,
# HitAirExplosion, HitShipExplosion, HitObjectExplosion, HitGroundExplosion, HitDefaultExplosion

InFlightEffect=None

HitShipExplosion=effects/explosions/emitters/nuclear_underwater_surface_part
HitGroundExplosion=effects/explosions/emitters/nuclear_underwater_surface_part
HitDefaultExplosion=effects/explosions/emitters/nuclear_underwater_surface_part
HitWaterSplash=effects/explosions/emitters/nuclear_underwater_surface_part
HitGroundExplosion=effects/explosions/emitters/nuclear_underwater_surface_part

ExplosionOverwaterSplash=effects/explosions/emitters/nuclear_underwater_surface_part

UnderwaterTrail=effects/weapons/emitters/aswtorpedo_cavitation_particle
UnderwaterTrailPosition=0,0,-0.08

[---------- Colliders ----------]
[Colliders]
# creates the hit box for this object
Collider=col_main

[col_main]
Collider=Box
Position=0,0,0
Rotation=0,0,0
Scale=0.005,0.005,0.045
